<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      font-size: 13px;
      background: #1e1e1e;
      color: #e0e0e0;
      display: flex;
      flex-direction: column;
      height: 100vh;
      padding: 16px;
      gap: 12px;
    }

    h2 {
      font-size: 15px;
      font-weight: 600;
      color: #fff;
      letter-spacing: 0.3px;
    }

    .subtitle {
      font-size: 11px;
      color: #888;
      margin-top: 2px;
    }

    .buttons {
      display: flex;
      gap: 8px;
    }

    button {
      flex: 1;
      padding: 9px 12px;
      border: none;
      border-radius: 6px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      transition: opacity 0.15s;
    }

    button:hover { opacity: 0.85; }
    button:disabled { opacity: 0.4; cursor: not-allowed; }

    #btn-all {
      background: #4a4a4a;
      color: #fff;
    }

    #btn-selection {
      background: #0d99ff;
      color: #fff;
    }

    #status {
      font-size: 11px;
      color: #aaa;
      min-height: 16px;
    }

    #status.error { color: #ff6b6b; }
    #status.ok { color: #4caf50; }

    .stats {
      display: flex;
      gap: 8px;
    }

    .stat {
      flex: 1;
      background: #2a2a2a;
      border: 1px solid #3a3a3a;
      border-radius: 6px;
      padding: 8px 10px;
      text-align: center;
    }

    .stat-label {
      font-size: 10px;
      color: #666;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .stat-value {
      font-size: 20px;
      font-weight: 700;
      color: #fff;
      margin-top: 2px;
    }

    .copy-btn {
      width: 100%;
      padding: 10px;
      background: #2a2a2a;
      border: 1px solid #3a3a3a;
      color: #0d99ff;
      border-radius: 6px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      margin-top: auto;
    }

    .copy-btn:hover { background: #333; }
    .copy-btn:disabled { opacity: 0.4; cursor: not-allowed; }

    textarea {
      display: none;
    }
  </style>
</head>
<body>
  <div>
    <h2>ULON Extractor</h2>
    <div class="subtitle">Извлекает цвета и изображения</div>
  </div>

  <div class="buttons">
    <button id="btn-all">Вся страница</button>
    <button id="btn-selection">Выделение</button>
  </div>

  <div id="status">Готов к работе</div>

  <div class="stats" id="stats" style="display:none">
    <div class="stat">
      <div class="stat-label">Цветов</div>
      <div class="stat-value" id="cnt-colors">0</div>
    </div>
    <div class="stat">
      <div class="stat-label">Картинок</div>
      <div class="stat-value" id="cnt-images">0</div>
    </div>
  </div>

  <button class="copy-btn" id="btn-copy" disabled>Скопировать JSON</button>
  <textarea id="output"></textarea>

  <script>
    const btnAll = document.getElementById("btn-all");
    const btnSelection = document.getElementById("btn-selection");
    const btnCopy = document.getElementById("btn-copy");
    const status = document.getElementById("status");
    const output = document.getElementById("output");
    const statsEl = document.getElementById("stats");
    const cntColors = document.getElementById("cnt-colors");
    const cntImages = document.getElementById("cnt-images");

    let lightResult = null;

    function setButtons(disabled) {
      btnAll.disabled = disabled;
      btnSelection.disabled = disabled;
    }

    btnAll.addEventListener("click", () => {
      parent.postMessage({ pluginMessage: { type: "EXTRACT_ALL" } }, "*");
      status.textContent = "Сканирую...";
      status.className = "";
      setButtons(true);
      btnCopy.disabled = true;
    });

    btnSelection.addEventListener("click", () => {
      parent.postMessage({ pluginMessage: { type: "EXTRACT_SELECTION" } }, "*");
      status.textContent = "Сканирую...";
      status.className = "";
      setButtons(true);
      btnCopy.disabled = true;
    });

    btnCopy.addEventListener("click", async () => {
      if (!lightResult) return;

      const json = JSON.stringify(lightResult, null, 2);
      const sizeKb = Math.round(json.length / 1024);

      btnCopy.disabled = true;
      btnCopy.textContent = "Копирую...";

      try {
        await navigator.clipboard.writeText(json);
        btnCopy.textContent = `Скопировано! (${sizeKb} KB)`;
      } catch {
        try {
          output.value = json;
          output.style.display = "block";
          output.focus();
          output.select();
          const ok = document.execCommand("copy");
          output.style.display = "none";
          if (!ok) throw new Error("failed");
          btnCopy.textContent = `Скопировано! (${sizeKb} KB)`;
        } catch {
          output.style.display = "none";
          status.textContent = "Ошибка копирования";
          status.className = "error";
          btnCopy.textContent = "Скопировать JSON";
          btnCopy.disabled = false;
          return;
        }
      }

      btnCopy.disabled = false;
      setTimeout(() => { btnCopy.textContent = "Скопировать JSON"; }, 2000);
    });

    window.onmessage = (event) => {
      const msg = event.data.pluginMessage;
      if (!msg) return;

      if (msg.type === "ERROR") {
        status.textContent = msg.message;
        status.className = "error";
        setButtons(false);
      }

      if (msg.type === "RESULT") {
        lightResult = msg.payload;
        setButtons(false);

        const colors = Array.isArray(lightResult) && lightResult[0]?.colors
          ? lightResult[0].colors : [];
        const images = Array.isArray(lightResult) && lightResult[1]?.images
          ? lightResult[1].images : [];

        cntColors.textContent = colors.length;
        cntImages.textContent = images.length;
        statsEl.style.display = "flex";

        status.textContent = `Готово: ${colors.length} цветов, ${images.length} картинок`;
        status.className = "ok";
        btnCopy.disabled = colors.length === 0 && images.length === 0;
      }
    };
  </script>
</body>
</html>
